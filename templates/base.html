<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="/static/js/common.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyFlow{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
</head>
<body>
<header class="topbar">
    <a href="/" class="logo"><span class="brand-mark" aria-hidden="true">◧</span> StudyFlow<span class="brand-caption">БЮРО ОБУЧЕНИЯ</span></a>
    <nav>
        <a href="/">Обзор</a>
        <a href="/courses">Курсы</a>
        <a href="/kanban">План</a>
        <a href="/timer">Фокус</a>
        <a href="/pet">Питомец</a>
        <a href="/achievements">Награды</a>
        <a href="/insights">Прогресс</a>
    </nav>
    <button class="btn small" id="theme-toggle">◐ Тема</button>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <span>StudyFlow / Бюро обучения</span><span>Знание начинается с любопытства. / 01—04</span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
function showToast(msg, type = "ok") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show " + type;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 2200);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
